<!DOCTYPE html>
<html>
<head>
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Hangman</h1>
<div id="hangman">
    <div id="head" class="part"></div>
    <div id="body" class="part"></div>
    <div id="leftArm" class="part"></div>
    <div id="rightArm" class="part"></div>
    <div id="leftLeg" class="part"></div>
    <div id="rightLeg" class="part"></div>
</div>
    <div id="word">_ _ _ _ _ _</div>

    <p>Wrong guesses: <span id="wrong">0</span></p>

    <input id="guessInput" maxlength="1">
    <button id="guessButton">Guess</button>

    <script src="script.js"></script>
</body>
</html>
